<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="ava.jpg">
<title>Trợ Lý Gemini · Liquid Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="index1.css">
<style>
  .chat-box {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: 460px;
    overflow-y: auto;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--accent) transparent;
  }
  .chat-box::-webkit-scrollbar { width: 6px; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 999px; }

  .msg {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 1.5px solid var(--accent);
  }

  .msg-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 0.92rem;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow-glass);
  }

  .msg.user .msg-bubble {
    background: var(--accent);
    color: #FFFFFF;
    border-bottom-right-radius: 4px;
  }

  .msg.ai .msg-bubble {
    background: rgba(15, 23, 42, 0.7);
    border: var(--glass-border);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .key-config {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
    background: rgba(15, 23, 42, 0.4);
    padding: 10px 14px;
    border-radius: 14px;
    border: var(--glass-border);
  }
  .key-config input {
    flex: 1;
    background: rgba(15, 23, 42, 0.6);
    border: var(--glass-border);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--ink);
    font-size: 0.88rem;
    outline: none;
  }
  .key-config button {
    background: rgba(59, 130, 246, 0.2);
    border: 1px solid rgba(59, 130, 246, 0.4);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .key-config button:hover { background: var(--accent); color: #fff; }

  .input-area {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    position: relative;
    z-index: 3;
  }

  .input-area textarea {
    flex: 1;
    background: rgba(15, 23, 42, 0.6);
    border: var(--glass-border);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.92rem;
    resize: none;
    outline: none;
    height: 48px;
    transition: all 0.3s ease;
  }
  .input-area textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
  }
  .input-area textarea::placeholder { color: var(--muted); }

  .send-btn {
    background: var(--accent);
    border: none;
    color: #FFFFFF;
    padding: 0 20px;
    border-radius: 14px;
    font-family: var(--font-display);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }
  .send-btn:hover {
    background: #2563EB;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
  }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
</style>
</head>
<body>

<svg style="display:none;position:absolute;" xmlns="http://www.w3.org/2000/svg">
  <filter id="container-glass" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" id="glassDisplacement" />
  </filter>
</svg>

<div class="top-left-profile">
  <img src="ava.jpg" alt="Avatar" class="user-avatar" onerror="this.src='https://via.placeholder.com/32'">
  <span class="user-name">chisaki167</span>
</div>

<div class="top-right-controls">
  <button class="bg-toggle-btn" id="bgToggleBtn" onclick="toggleBackground()">🎬 Nền: Tắt</button>
</div>

<video class="bg-video hidden" id="bgVideo" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>
<div class="bg-overlay hidden" id="bgOverlay"></div>

<main class="wrap">
  <header class="profile">
    <h1>Trợ Lý <span class="highlight">Gemini AI</span></h1>
    <h2>Hỏi đáp thông minh · Giao diện Liquid Glass</h2>
  </header>

  <div class="card">
    <div class="key-config">
      <input type="password" id="apiKeyInput" placeholder="Dán mã khóa AQ... vào đây...">
      <button onclick="saveApiKey()">Lưu Key</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg ai">
        <img src="ava.jpg" class="msg-avatar" alt="AI" onerror="this.src='https://via.placeholder.com/32'">
        <div class="msg-bubble">Xin chào! Vui lòng lưu mã khóa và bắt đầu trò chuyện nhé.</div>
      </div>
    </div>

    <div class="input-area">
      <textarea id="promptInput" placeholder="Nhập câu hỏi..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendPrompt()">
        <span>Gửi</span> <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>
</main>

<footer>Trang Trợ Lý AI · Github by chisaki167</footer>

<script>
  function toggleBackground() {
    const v = document.getElementById('bgVideo');
    const o = document.getElementById('bgOverlay');
    const b = document.getElementById('bgToggleBtn');
    if (!v || !o || !b) return;
    v.classList.toggle('hidden');
    o.classList.toggle('hidden');
    b.innerHTML = v.classList.contains('hidden') ? '🎬 Nền: Tắt' : '🎬 Nền: Bật';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
    }

    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', (e.clientX - r.left) + 'px');
        card.style.setProperty('--mouse-y', (e.clientY - r.top) + 'px');
      });
    });
  });

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) {
      alert('Vui lòng nhập khóa hợp lệ!');
      return;
    }
    localStorage.setItem('gemini_api_key', key);
    alert('Đã lưu mã khóa thành công!');
  }

  async function sendPrompt() {
    const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) {
      alert('Bạn chưa nhập mã khóa!');
      return;
    }

    const input = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatBox = document.getElementById('chatBox');
    const text = input.value.trim();

    if (!text) return;

    appendMessage('user', text);
    input.value = '';
    sendBtn.disabled = true;

    const aiMsgDiv = appendMessage('ai', 'Đang suy nghĩ...');

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
      });

      const data = await res.json();
      if (data.candidates && data.candidates[0].content) {
        aiMsgDiv.querySelector('.msg-bubble').textContent = data.candidates[0].content.parts[0].text;
      } else if (data.error) {
        aiMsgDiv.querySelector('.msg-bubble').textContent = 'Lỗi từ Google API: ' + (data.error.message || 'Không xác định');
      } else {
        aiMsgDiv.querySelector('.msg-bubble').textContent = 'Lỗi: Phản hồi không hợp lệ từ máy chủ.';
      }
    } catch (err) {
      aiMsgDiv.querySelector('.msg-bubble').textContent = 'Lỗi kết nối máy chủ.';
    } finally {
      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  }

  function appendMessage(role, text) {
    const chatBox = document.getElementById('chatBox');
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatarSrc = role === 'user' ? 'ava1.jpg' : 'ava.jpg';
    msg.innerHTML = `
      <img src="${avatarSrc}" class="msg-avatar" alt="${role}" onerror="this.src='https://via.placeholder.com/32'">
      <div class="msg-bubble">${text}</div>
    `;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  document.getElementById('promptInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendPrompt();
    }
  });
</script>
</body>
</html>
