<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/jpeg" href="ava.jpg">
<title>Trợ Lý Gemini · Liquid Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="index1.css">
<style>
  .gemini-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    text-align: center;
    padding: 10px 0;
  }

  .gemini-icon-glow {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: rgba(59, 130, 246, 0.15);
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    color: var(--accent);
    box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
  }

  .quick-input-area {
    width: 100%;
    max-width: 650px;
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .quick-input-area textarea {
    flex: 1;
    background: rgba(15, 23, 42, 0.6);
    border: var(--glass-border);
    border-radius: 16px;
    padding: 14px 18px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.95rem;
    resize: none;
    outline: none;
    height: 52px;
    transition: all 0.3s ease;
  }

  .quick-input-area textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
  }

  .quick-send-btn {
    background: var(--accent);
    border: none;
    color: #FFFFFF;
    padding: 0 24px;
    border-radius: 16px;
    font-family: var(--font-display);
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    text-decoration: none;
  }

  .quick-send-btn:hover {
    background: #2563EB;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
  }

  .preset-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 650px;
    margin-top: 5px;
  }

  .tag-btn {
    background: rgba(15, 23, 42, 0.5);
    border: var(--glass-border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tag-btn:hover {
    border-color: var(--accent);
    color: var(--ink);
    background: rgba(59, 130, 246, 0.15);
  }
</style>
</head>
<body>

<svg style="display:none;position:absolute;" xmlns="http://www.w3.org/2000/svg">
  <filter id="container-glass" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" id="glassDisplacement" />
  </filter>
</svg>

<div class="top-left-profile">
  <img src="ava.jpg" alt="Avatar" class="user-avatar" onerror="this.src='https://via.placeholder.com/32'">
  <span class="user-name">chisaki167</span>
</div>

<div class="top-right-controls">
  <button class="bg-toggle-btn" id="bgToggleBtn" onclick="toggleBackground()">🎬 Nền: Tắt</button>
</div>

<video class="bg-video hidden" id="bgVideo" autoplay muted loop playsinline>
  <source src="background.mp4" type="video/mp4">
</video>
<div class="bg-overlay hidden" id="bgOverlay"></div>

<main class="wrap">
  <header class="profile">
    <h1>Trợ Lý <span class="highlight">Gemini AI</span></h1>
    <h2>Hỏi đáp thông minh · Trực tiếp không cần API Key</h2>
  </header>

  <div class="card">
    <div class="gemini-container">
      <div class="gemini-icon-glow">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>

      <div>
        <h3 style="font-size: 1.25rem; color: var(--ink); margin-bottom: 6px; font-family: var(--font-display);">Nhập câu hỏi cho Gemini</h3>
        <p style="color: var(--muted); font-size: 0.9rem;">Gửi câu hỏi trực tiếp sang Gemini AI chính chủ để nhận câu trả lời đầy đủ & mượt mà nhất.</p>
      </div>

      <div class="quick-input-area">
        <textarea id="promptInput" placeholder="Nhập thắc mắc hoặc bài tập cần giải đáp tại đây..." rows="1"></textarea>
        <button class="quick-send-btn" onclick="sendToGemini()">
          <span>Hỏi Gemini</span> <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

      <div class="preset-tags">
        <button class="tag-btn" onclick="fillPrompt('Giải bài tập KHTN 8 hóa học bài 5')">🧪 Giải bài KHTN 8</button>
        <button class="tag-btn" onclick="fillPrompt('Tóm tắt kiến thức Lịch Sử - Địa Lý lớp 8')">📜 Ôn tập LS-ĐL 8</button>
        <button class="tag-btn" onclick="fillPrompt('Hướng dẫn làm bài tập Tin Học 8')">💻 Hỏi Tin Học 8</button>
        <button class="tag-btn" onclick="fillPrompt('Phân tích tác phẩm Ngữ Văn lớp 8')">📖 Phân tích Ngữ Văn</button>
      </div>
    </div>
  </div>
</main>

<footer>Trang Trợ Lý AI · Github by chisaki167</footer>

<script>
  function toggleBackground() {
    const v = document.getElementById('bgVideo');
    const o = document.getElementById('bgOverlay');
    const b = document.getElementById('bgToggleBtn');
    if (!v || !o || !b) return;
    v.classList.toggle('hidden');
    o.classList.toggle('hidden');
    b.innerHTML = v.classList.contains('hidden') ? '🎬 Nền: Tắt' : '🎬 Nền: Bật';
  }

  function fillPrompt(text) {
    const input = document.getElementById('promptInput');
    input.value = text;
    input.focus();
  }

  function sendToGemini() {
    const input = document.getElementById('promptInput');
    const text = input.value.trim();
    if (text) {
      const url = `https://gemini.google.com/app?q=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    } else {
      window.open('https://gemini.google.com', '_blank');
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', (e.clientX - r.left) + 'px');
        card.style.setProperty('--mouse-y', (e.clientY - r.top) + 'px');
      });
    });

    document.getElementById('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendToGemini();
      }
    });
  });
</script>
</body>
</html>
